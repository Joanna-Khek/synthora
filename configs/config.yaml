timezone: Asia/Singapore  # times are stored in UTC and shown in this zone

llm:
  model: claude-haiku-5-5
  max_tokens: 16000
  effort: medium      # low | medium | high | xhigh | max

bot:
  album_wait_seconds: 1.5   # how long to wait for the rest of a photo album
  preview_chars: 600        # characters of Source text shown in the Telegram reply
  max_reply_chars: 4096     # max telegram reply

capture:
  max_linked: 25            # safety ceiling on links followed from one LinkedIn post
  max_concurrent: 4         # links read or distilled at the same time
  max_source_chars: 200000  # ≈50K tokens. keeps a Distiller request far below Haiku 5.5's 100K-token price step (5x)

extraction:
  timeout_seconds: 20       # per HTTP request made by the Extraction Server

storage:
  db_path: data/synthora.db   # relative to the repo root

tracing:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
  experiment: dev-synthora-server

vault:
  name: synthora
  path: C:/Users/joann/Vaults/synthora-test
  busy_seconds: 120         # FR-25: don't edit a note changed this recently (you may be typing)
  git_commits: false        # FR-20: commit the Vault after each Capture (needs `git init` there)
