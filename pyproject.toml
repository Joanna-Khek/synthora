[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.9,<0.13.0"]

[dependency-groups]
dev = [
  "ipykernel>=7.4.0",
  "pre-commit>=4.7.0",
  "pytest>=9.2.0"
]

[project]
dependencies = [
  "httpx>=0.28.1",
  "langchain-anthropic>=1.7.10",
  "langgraph>=1.2.22",
  "loguru>=0.8.0",
  "mcp[cli]>=2.3.0",
  "pydantic-settings>=2.16.3",
  "python-telegram-bot>=22.8",
  "pyyaml>=6.0.3",
  "trafilatura>=2.3.1"
]
description = "Add your description here"
name = "synthora"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[project.scripts]
synthora-bot = "synthora.server.bot.app:main"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits the real internet; run with: uv run pytest -m live"]
