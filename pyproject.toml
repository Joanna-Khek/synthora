[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.9,<0.13.0"]

[dependency-groups]
dev = [
  "ipykernel>=7.4.0",
  "pre-commit>=4.7.0",
  "pytest>=9.2.0"
]

[project]
dependencies = [
  "fastapi>=0.165.0",
  "httpx>=0.28.1",
  "langchain-anthropic>=1.7.10",
  "langgraph>=1.2.22",
  "loguru>=0.8.0",
  "mcp[cli]>=2.3.0",
  "mlflow>=3.18.0",
  "pydantic-settings>=2.16.3",
  "python-telegram-bot>=22.8",
  "pyyaml>=6.0.3",
  "trafilatura>=2.3.1",
  "tzdata>=2026.6",
  "uvicorn>=0.54.0"
]
description = "Add your description here"
name = "synthora"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[project.scripts]
synthora-api = "synthora.api.app:main"
synthora-bot = "synthora.bot.app:main"
synthora-runner = "synthora.runner.cli:main"

[tool.pytest.ini_options]
addopts = "-m 'not live and not obsidian'"
markers = [
  "live: hits the real internet; run with: uv run pytest -m live",
  "obsidian: needs Obsidian running with the synthora-test vault; run with: uv run pytest -m obsidian"
]
