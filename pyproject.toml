[project]
name = "synthora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "pydantic-settings>=2.16.3",
    "python-telegram-bot>=22.8",
    "trafilatura>=2.3.1",
]

[project.scripts]
synthora-bot = "synthora.server.bot.app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

